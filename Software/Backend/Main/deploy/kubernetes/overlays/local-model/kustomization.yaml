apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: supporthr-local

resources:
  - ../local
  - ollama.yaml

configMapGenerator:
  - name: local-ollama-files
    files:
      - start-local-ollama.sh

generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: backend-local-model-patch.yaml
  - path: supporthr-api-hpa-delete.yaml
  - path: supporthr-worker-hpa-delete.yaml
