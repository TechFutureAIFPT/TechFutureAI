apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-ollama
  labels:
    app.kubernetes.io/name: local-ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: local-ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-ollama
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ollama
          image: ollama/ollama:0.40.7
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/local-model-files/start-local-ollama.sh"]
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_MODELS
              value: /root/.ollama/models
            - name: OLLAMA_NO_CLOUD
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_KEEP_ALIVE
              value: 10m
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          startupProbe:
            exec:
              command: ["ollama", "show", "cv-match:7b-local-sft-v2"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command: ["ollama", "show", "cv-match:7b-local-sft-v2"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["ollama", "show", "cv-match:7b-local-sft-v2"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama/models
              readOnly: true
            - name: local-ollama-files
              mountPath: /local-model-files
              readOnly: true
      volumes:
        - name: ollama-models
          hostPath:
            path: /ollama-seed
            type: Directory
        - name: local-ollama-files
          configMap:
            name: local-ollama-files
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: local-ollama
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: local-ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
      protocol: TCP
