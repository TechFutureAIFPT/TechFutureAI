services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: supporthr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supporthr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supporthr_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-supporthr_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supporthr} -d ${POSTGRES_DB:-supporthr_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - supporthr

volumes:
  postgres-data:
    name: supporthr-postgres-data

networks:
  supporthr:
    name: supporthr-network
    driver: bridge
