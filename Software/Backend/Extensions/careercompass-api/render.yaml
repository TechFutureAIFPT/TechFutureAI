services:
  - type: web
    name: careercompass-api
    runtime: python
    region: singapore
    plan: free
    rootDir: Software/Backend/Extensions/careercompass-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://ijkilhwpwxdkoxhgnjut.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: DATA_RETRIEVAL_SERVICE_URL
        value: https://careercompass-ai-api.vercel.app
